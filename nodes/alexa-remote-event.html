<script type="text/x-red" data-template-name="alexa-remote-event">
	<div class="form-row">
		<label for="node-input-name"><i class="icon-tag"></i> Name</label>
		<input type="text" id="node-input-name" placeholder="Optional">
	</div>
	<div class="form-row">
		<label for="node-input-account"><i class="fa fa-amazon"></i> Account</label>
		<input id="node-input-account">
	</div>
	<div class="form-row">
		<label for="node-input-event"><i class="fa fa-sort"></i> Command</label>
		<select id="node-input-event" style="width: 70%">
			<optgroup label="Account">
			<option value="account-login-required"		>Login Required				</option>
			<option value="account-state"				>Account State Change		</option>
			</optgroup>
			<optgroup label="Push connection">
			<option value="ws-disconnect"				>Disconnect					</option>
			<option value="ws-error"					>Error						</option>
			<option value="ws-connect"					>Connect					</option>
			<option value="ws-unknown-message"			>Unknown Message			</option>
			<option value="ws-device-connection-change"	>Device Connection Change	</option>
			<option value="ws-bluetooth-state-change"	>Bluetooth State Change		</option>
			<option value="ws-audio-player-state-change">Audioplayer State Change	</option>
			<option value="ws-media-queue-change"		>Media Queue Change			</option>
			<option value="ws-media-change"				>Media Change				</option>
			<option value="ws-media-progress-change"	>Media Progress Change 		</option>
			<option value="ws-volume-change"			>Volume Change				</option>
			<option value="ws-content-focus-change"		>Content Focus Change		</option>
			<option value="ws-equilizer-state-change"	>Equalizer State Change		</option>	
			<option value="ws-notification-change"		>Notification Change		</option>	
			<option value="ws-device-activity"			>Device Activity			</option>	
			<option value="ws-todo-change"				>Todo/List Change			</option>
			<option value="ws-now-playing-updated"		>Now Playing Updated		</option>
			<option value="ws-unknown-command"			>Unknown Command			</option>
			</optgroup>
		</select>
	</div>
</script>

<script type="text/x-red" data-help-name="alexa-remote-event">
	<style>
		table, th, td {
			border-collapse: collapse;
			border: 1px solid rgb(204, 204, 204);
			padding: 4px 8px;
		}
	</style>

	<p>Listens to account events and to events of the Alexa push connection.</p>
	<ul>
		<li><strong>Account</strong> events always work:
			<ul>
				<li><em>Login Required</em> fires when the account needs a new browser login (for example when the
					saved authentication expired). <code>msg.payload.loginUrl</code> is the link to open. Connect it to
					a notification (Home Assistant, Telegram, e-mail, ...) so you never miss it.</li>
				<li><em>Account State Change</em> fires on every state change (<code>READY</code>, <code>ERROR</code>,
					<code>WAIT_PROXY</code>, <code>REFRESH</code>, ...).</li>
			</ul>
		</li>
		<li><strong>Push connection</strong> events need <em>Events</em> to be <em>on</em> in the account.</li>
	</ul>
	<hr>
	<h3><strong>Outputs</strong></h3>
	<ul>
		<li><strong>topic</strong>
			<ul>
				<li>the event name (account events)</li>
			</ul>
		</li>
		<li><strong>payload</strong>
			<ul>
				<li>the event payload; for account events <code>{ code, message, time, loginUrl }</code></li>
			</ul>
		</li>
	</ul>
	<hr>
	<h3><strong>References</strong></h3>
	<ul>
		<li><a href="https://npmjs.com/package/@renoviana/node-red-contrib-alexa-remote2">npm</a> - the nodes npm repository</li>
		<li><a href="https://github.com/renoviana/node-red-contrib-alexa-remote2">GitHub</a> - the nodes GitHub repository
		</li>
	</ul>
</script>

<script type="text/javascript">
	RED.nodes.registerType('alexa-remote-event', {
		category: 'alexa',
		color: '#6fbad8',
		defaults: {
			name: { value: '' },
			account: { value: '', type: 'alexa-remote-account', required: true },
			event: { value: 'ws-device-activity', required: true }
		},
		inputs: 0,
		outputs: 1,
		icon: 'alexa-remote-icon.png',
		paletteLabel: 'Alexa Event',
		label: function () {
			function keyToLabel(str) {
					const match = str.match(/(?:[A-Z]?[a-z]+)|[A-Z]|[0-9]+/g);
					if (match) str = match.map(s => s.slice(0, 1).toUpperCase() + s.slice(1)).join(' ');
					return str;
			}
			
			const event = String(this.event || '');
			return this.name || `On ${keyToLabel(event.replace(/^(ws|account)-/, ''))}`;
		},
		labelStyle: function () {
			return this.name ? "node_label_italic" : "";
		}
	});
</script>
